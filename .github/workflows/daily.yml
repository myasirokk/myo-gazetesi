name: Günlük Gazete Basımı

on:
  schedule:
    # Her gün Türkiye saatiyle 06:00'da çalışır (UTC 03:00)
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gazete Verilerini ve Arşivi Güncelle
        run: |
          python scripts/fetch_news.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: günlük gazete basımı ve arşiv güncellemesi [skip ci]" || exit 0
          git push
