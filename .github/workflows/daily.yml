name: Günlük Gazete Basımı

on:
  schedule:
    # Her gün Türkiye saati ile 07:00 (UTC 04:00)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install requests beautifulsoup4

      - name: Gazete Verilerini ve Arşivi Güncelle
        run: |
          python fetch_news.py

      - name: Değişiklikleri Kaydet ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: günlük baskı ve arşiv güncellendi [skip ci]" && git push)
