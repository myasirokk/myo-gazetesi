name: 07:00 Günlük Baskı Otomasyonu

on:
  schedule:
    # Türkiye Saati (UTC+3) ile 07:00 -> UTC saatiyle 04:00
    - cron: '0 4 * * *'
  # Dilediğinde GitHub arayüzünden tek tıkla elle tetikleyebilmek için:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-edition:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Haberleri Tara ve Baskıyı Güncelle
        run: |
          python scripts/fetch_news.py

      - name: Değişiklikleri Kaydet ve Push'la
        run: |
          git config --global user.name "MYO Bot"
          git config --global user.email "bot@myogazetesi.internal"
          git add data/edition.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): 07:00 yeni baskı basıldı [skip ci]" && git push)